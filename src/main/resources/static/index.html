<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
        }
        button {
            margin-top: 12px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .panel {
            margin-top: 20px;
            padding: 16px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .response {
            white-space: pre-wrap;
            min-height: 120px;
        }
        .loading {
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Enterprise AI Assistant</h1>

    <label><strong>Ask a Question</strong></label>

    <textarea id="question">Why are users getting AUTH-403 errors?</textarea>

    <br>

    <button onclick="askQuestion()">Ask</button>

    <div class="panel">
        <strong>Response</strong>
        <div id="response" class="response">
            Ask a question to begin.
        </div>
    </div>

    <div class="panel">
        <strong>Sources</strong>
        <div id="sources">
            No sources available.
        </div>
    </div>

</div>

<script>
    async function askQuestion() {

        const question = document.getElementById('question').value;
        const responseDiv = document.getElementById('response');
        const sourcesDiv = document.getElementById('sources');

        responseDiv.innerHTML = '<span class="loading">Generating response...</span>';
        sourcesDiv.innerHTML = '<span class="loading">Retrieving sources...</span>';

        try {

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: question
                })
            });

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            const data = await response.json();

            responseDiv.textContent = data.response || '';

            const sources = data.sources || [];

            if (sources.length === 0) {
                sourcesDiv.textContent = 'No sources returned.';
            } else {

                let html = '<ul>';

                for (const source of sources) {
                    html += '<li>' + source + '</li>';
                }

                html += '</ul>';

                sourcesDiv.innerHTML = html;
            }

        } catch (e) {
            responseDiv.textContent = 'Error: ' + e.message;
            sourcesDiv.textContent = 'Unable to load sources.';
        }
    }
</script>

</body>
</html>
